name: accommodation_rental_workspace
publish_to: none

environment:
  sdk: ^3.12.2

workspace:
  - apps/accommodation_app
  - packages/accommodation_features
  - packages/accommodation_core
  - packages/accommodation_ui

dev_dependencies:
  melos: ^8.9.0

melos:
  scripts:
    analyze:
      run: flutter analyze
    test:
      run: melos exec --dir-exists=test --concurrency=1 --fail-fast -- "flutter test"
    format:
      run: dart format apps packages
